const pid=()=>{try{let v=localStorage.getItem('bkpid');if(!v){v='u'+Math.random().toString(36).slice(2,10);localStorage.setItem('bkpid',v)}return v}catch(e){return 'u'+Math.random().toString(36).slice(2,10)}};
const nmv=()=>($('nm').value||'لاعب').trim().slice(0,12);
function ok(o){const p=S.pl[S.turn];if(!o||typeof o.a!=='string')return false;if(S.trade)return false;
 if(o.a==='m'||o.a==='b')return S.stage==='move'&&Number.isInteger(o.i)&&o.i>=0&&o.i<p.hand.length&&(o.a==='b'||o.d===1);
 if(o.a==='y'||o.a==='d'||o.a==='k')return S.stage==='buy'&&(o.a!=='y'||p.cash>=price(S))&&(o.a!=='d'||S.pend.m===null);
 if(o.a==='u'){if(S.stage!=='move'||!Number.isInteger(o.i)||!p.ab[o.i])return false;if(AB[p.ab[o.i]][3]==='pt'){const j=Math.floor(o.d/100),t=o.d%100;return Number.isInteger(o.d)&&j!==S.turn&&!!S.pl[j]&&!S.pl[j].out&&t>=0&&t<N}const op=opts(p.ab[o.i],p);return !op||(op.length>0&&op.some(x=>x[0]===o.d))}
 if(o.a==='g'){const t=o.i;return S.stage==='move'&&!S.upg&&Number.isInteger(t)&&T[t]&&T[t].k==='p'&&S.own[t]===S.turn&&canBuild(S,t,S.turn)&&p.cash>=ucost(t)}
 if(o.a==='s'){const t=o.i;return S.stage==='move'&&Number.isInteger(t)&&S.own[t]===S.turn&&!(S.mg&&S.mg[t])}
 if(o.a==='mg')return S.stage==='move'&&Number.isInteger(o.i)&&S.own[o.i]===S.turn&&!(S.mg&&S.mg[o.i]);
 if(o.a==='rd')return S.stage==='move'&&Number.isInteger(o.i)&&S.own[o.i]===S.turn&&!!(S.mg&&S.mg[o.i])&&p.cash>=rdc(o.i);
 if(o.a==='l')return S.stage==='move'&&(o.i===0||o.i===1)&&!p.debts.some(d=>d.loan);
 if(o.a==='tp'){const d=o.d;if(S.stage!=='move'||!d||!Number.isInteger(d.to)||d.to===S.turn||!S.pl[d.to]||S.pl[d.to].out)return false;const q=S.pl[d.to];if(!Number.isInteger(d.gm)||!Number.isInteger(d.wm)||d.gm<0||d.wm<0||d.gm>p.cash||d.wm>q.cash||!Array.isArray(d.gp)||!Array.isArray(d.wp))return false;if(!d.gp.every(t=>Number.isInteger(t)&&S.own[t]===S.turn)||!d.wp.every(t=>Number.isInteger(t)&&S.own[t]===d.to))return false;return !d.gp.concat(d.wp).some(t=>S.mg&&S.mg[t])&&d.gm+d.wm+d.gp.length+d.wp.length>0}
 return false}
const canBuild=(s,t,i)=>{const g=T[t].g,lv=s.lv||{};return T.every((x,j)=>x.g!==g||s.own[j]===i)&&!T.some((x,j)=>x.g===g&&s.mg&&s.mg[j])&&(lv[t]||0)<3&&(lv[t]||0)===Math.min(...T.map((x,j)=>x.g===g?(lv[j]||0):9))};
const sellVal=(s,t)=>Math.round(T[t].p*.5/50)*50+Math.round(((s.lv||{})[t]||0)*ucost(t)*.5/50)*50,attackOk=(s,j)=>{const q=s.pl[j];if(q.prot){q.prot=0;lg(s,'🛡 '+q.name+' لغى الهجوم بـ«أنا ابن فلان»');return false}return true};
function sellP(s,t,pi){const p=s.pl[pi??s.turn],v=sellVal(s,t);p.cash+=v;delete s.own[t];if(s.lv)delete s.lv[t];lg(s,'💰 '+p.name+' باع '+T[t].n+' للبنك +'+v)}
function loan(s,i,pi){pi=pi??s.turn;const p=s.pl[pi],a=i===0?400:Math.max(400,Math.round(val(s,pi)*.3/100)*100),r=Math.round(a*1.2/50)*50;p.cash+=a;p.debts.push({due:s.round+(i===0?3:4),amt:r,loan:1});lg(s,'🏦 '+p.name+' خد سلفة '+a+' (هيردّ '+r+')')}
function tradeDo(s){const t=s.trade,A=s.pl[t.from],B=s.pl[t.to];if(!(A.cash>=t.gm&&B.cash>=t.wm&&t.gp.every(x=>s.own[x]===t.from)&&t.wp.every(x=>s.own[x]===t.to))){lg(s,'⚠️ الصفقة اتلغت (حاجة اتغيرت)');s.trade=null;return}
 A.cash+=t.wm-t.gm;B.cash+=t.gm-t.wm;t.gp.forEach(x=>s.own[x]=t.to);t.wp.forEach(x=>s.own[x]=t.from);lg(s,'🤝 صفقة تمت بين '+A.name+' و'+B.name);s.trade=null}
function apply(s,o){const t=o.a;if(t==='m')move(s,o.i,o.d);else if(t==='b')burn(s,o.i);else if(t==='y')buy(s);else if(t==='d')dealDraw(s);else if(t==='k')endTurn(s);else if(t==='u')useAb(s,o.i,o.d);else if(t==='g')build(s,o.i);else if(t==='s')sellP(s,o.i);else if(t==='mg')mortgage(s,o.i);else if(t==='rd')redeem(s,o.i);else if(t==='l')loan(s,o.i);else if(t==='tp'){s.trade={from:s.turn,to:o.d.to,gm:o.d.gm,wm:o.d.wm,gp:o.d.gp.slice(),wp:o.d.wp.slice()};lg(s,'🤝 '+s.pl[s.turn].name+' عرض صفقة على '+s.pl[o.d.to].name)}}
function hostApply(id,o){if(!S||S.phase!=='play'||!o)return;const T0=S.trade,go=f=>{const s=clone(S);s.evs=[];s.mv2=null;s.en=(s.en||0)+1;f(s);settle(s);commit(s)};
 const di=S.pl.findIndex(x=>x.id===id);if(di<0)return;
 if(o.a==='x'){if(!S.pl[di].out)go(s=>surrender(s,di));return}
 if(o.a==='kick'){if(S.pl[0].id===id&&Number.isInteger(o.i)&&o.i>0&&S.pl[o.i]&&!S.pl[o.i].out)go(s=>{s.ban=s.ban||[];s.ban.push(s.pl[o.i].id);surrender(s,o.i,1)});return}
 if(S.dbt&&S.dbt.length){if(!S.dbt.includes(di)||!okD(o,di))return;go(s=>applyD(s,di,o));return}
 if(o.a==='ta'||o.a==='tr'){if(!T0||!(LOCAL||S.pl[T0.to].id===id))return;go(s=>{if(o.a==='ta')tradeDo(s);else{lg(s,'🙅 '+s.pl[T0.to].name+' رفض عرض '+s.pl[T0.from].name);s.trade=null}});return}
 if(S.pl[S.turn].id!==id)return;
 if(o.a==='tc'){if(T0)go(s=>{s.trade=null;lg(s,'↩️ '+s.pl[S.turn].name+' سحب عرضه')});return}
 if(!ok(o))return;go(s=>apply(s,o))}
function act(a,i,d){const o={a,i,d};if(LOCAL||HOST)hostApply(me,o);else if(conn&&conn.open)conn.send({t:'act',id:me,o});else toast('مفيش اتصال')}
async function commit(s){S=s;ask=null;if(LOCAL){me=((S.dbt&&S.dbt.length&&S.pl[S.dbt[0]])||S.pl[S.turn]||{id:me}).id;render();return}if(HOST){try{if(s.phase==='play')localStorage.setItem('bksave',JSON.stringify({code,S:s}));else localStorage.removeItem('bksave')}catch(e){}}render();conns.forEach(c=>{try{c.open&&c.send({t:'s',s})}catch(e){}})}
function hostMsg(cn,d){if(!d)return;if(d.t==='join'){if((S.ban||[]).includes(String(d.id))){cn.send({t:'kicked'});return}cn.ok=true;const ex=S.pl.some(p=>p.id===d.id);if(S.phase==='lobby'&&!ex&&S.pl.length<10){const s=clone(S);s.pl.push(mkP(String(d.id),String(d.name).replace(/[<>&"'`]/g,'').slice(0,12)));commit(s)}else cn.send({t:'s',s:S})}else if(d.t==='act'&&cn.ok)hostApply(String(d.id),d.o)}
function create(){me=pid();toast('بجهّز الغرفة…');startHost(null,{phase:'lobby',pl:[mkP(me,nmv())]})}
const BRK=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt','wss://test.mosquitto.org:8081'];
const ALPH='ABCDEFGHJKMNPQRSTUVWXYZ23456789',rc=n=>Array.from({length:n},()=>ALPH[Math.floor(Math.random()*ALPH.length)]).join('');
let mq=null,base='',cmap={};
function mconn(i,ok,fail){const c=mqtt.connect(BRK[i],{clientId:'bkh_'+rc(10),reconnectPeriod:2000,connectTimeout:7000,clean:true});let done=false;
 c.on('connect',()=>{if(!done){done=true;ok(c)}});c.on('error',()=>{});
 setTimeout(()=>{if(!done){done=true;try{c.end(true)}catch(e){}fail()}},8000)}
function startHost(c,st){HOST=false;
 const tryB=i=>{if(i>=BRK.length){toast('تعذر الاتصال بأي خادم، جرّب شبكة تانية');return}
  const idx=c?Number(c[0])-1:i;
  mconn(idx,cl=>{mq=cl;code=c||String(idx+1)+rc(7);base='bkhg/'+code;cl.subscribe(base+'/up');
   cl.on('message',(t,p)=>{let m;try{m=JSON.parse(p.toString())}catch(e){return}if(!m.from||!m.d)return;
    let cn=cmap[m.from];if(!cn){cn=cmap[m.from]={ok:false,get open(){return !!mq&&mq.connected},send:x=>{try{mq.publish(base+'/dn/'+m.from,JSON.stringify(x))}catch(e){}}};conns.push(cn)}hostMsg(cn,m.d)});
   if(!HOST){HOST=true;S=st;toast('الغرفة جاهزة ✅ كود: '+code)}render()},()=>{c?toast('تعذر الاتصال بالخادم'):tryB(i+1)})};
 tryB(0)}
const RES=()=>{try{const v=JSON.parse(localStorage.getItem('bksave')||'null');if(v&&v.S&&v.S.phase==='play')return '<hr><button class=b onclick="resume()">▶ كمّل اللعبة المحفوظة (غرفة '+v.code+')</button>'}catch(e){}return ''};
function resume(){try{const v=JSON.parse(localStorage.getItem('bksave'));me=pid();toast('برجّع الغرفة…');startHost(v.code,v.S)}catch(e){toast('تعذر الاستعادة')}}
function join(){me=pid();code=$('cd').value.toUpperCase().replace(/[^A-Z0-9]/g,'');if(code.length!==8||!'123'.includes(code[0])){toast('الكود غلط، لازم 8 حروف وأرقام');return}const n=nmv();toast('بدخل الغرفة…');base='bkhg/'+code;
 const jm={t:'join',id:me,name:n};
 mconn(Number(code[0])-1,cl=>{mq=cl;cl.subscribe(base+'/dn/'+me);
  conn={get open(){return !!mq&&mq.connected},send:x=>mq.publish(base+'/up',JSON.stringify({from:me,d:x}))};
  cl.on('message',(t,p)=>{let d;try{d=JSON.parse(p.toString())}catch(e){return}if(d&&d.t==='s'){S=d.s;ask=null;if(S.ban&&S.ban.includes(me)&&!S.pl.some(p=>p.id===me)){toast('صاحب الغرفة طردك من الغرفة');S=null;if(mq)mq.end(true)}render()}else if(d&&d.t==='kicked'){toast('صاحب الغرفة طردك من الغرفة')}});
  cl.on('connect',()=>conn.send(jm));conn.send(jm);
  setInterval(()=>{if(!S&&conn.open)conn.send(jm)},3000);
  setTimeout(()=>{if(!S)toast('لسه مفيش رد. اتأكد من الكود وإن المضيف فاتح الصفحة')},10000)},()=>toast('تعذر الاتصال بالخادم، جرّب تاني'))}
render();
</script></body></html>
