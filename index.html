<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0e1324">
<title>بنك الخربطة</title>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=El+Messiri:wght@500;600;700&family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1324;--bg2:#161d36;--card:#182039;--card2:#202a4a;--ln:#2c365a;--fg:#ebe6d8;--mut:#9aa3c0;--ac:#d6b15e;--ac2:#9f7d34;--acf:#1d1606;--ok:#5bbf8a;--bad:#e2686c;--tile:#f3eee2;--tfg:#2a2519;--tmut:#86682f;--sp:#e6eaf3;--frame:#2a3358;--bs:min(calc(100vw - 12px),620px);--k:1;color-scheme:dark}
:root[data-theme=light]{--bg:#efe9dd;--bg2:#e5ddcb;--card:#fffbf3;--card2:#f4eddf;--ln:#ddd2bb;--fg:#2d2a24;--mut:#7c7464;--ac:#c49a44;--ac2:#987330;--frame:#c9b994;--sp:#eef1f6;color-scheme:light}
:root[data-big="1"]{--k:1.18}
*{box-sizing:border-box}html,body{margin:0}#app{overflow-x:clip}
body{background:radial-gradient(120% 70% at 50% -10%,var(--bg2),var(--bg) 62%);background-color:var(--bg);color:var(--fg);font-family:Cairo,Tahoma,sans-serif;font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,input{font:inherit;color:inherit}button{cursor:pointer;touch-action:manipulation}
#app{max-width:640px;margin:0 auto;padding:0 6px calc(200px + env(safe-area-inset-bottom))}
#app.home{padding:calc(14px + env(safe-area-inset-top)) 12px 40px}
h1,h2,h3{margin:6px 0;color:var(--ac);font-weight:800}h1{font-size:27px}h2{font-size:16px}h3{font-size:17px}
.mut{color:var(--mut);font-size:13px}.ok{color:var(--ok)}.bad{color:var(--bad)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px;margin:10px 0}
input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--ln);background:var(--bg2);margin:6px 0;outline:none}input:focus{border-color:var(--ac)}
.b{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:9px 16px;margin:3px;border:0;border-radius:12px;font-weight:800;background:var(--ac);color:var(--acf);box-shadow:0 2px 0 var(--ac2);transition:transform .08s}
.b:active{transform:translateY(1px);box-shadow:none}.b.g{background:var(--card2);color:var(--fg);border:1px solid var(--ln);box-shadow:none}
.b.red{background:var(--bad);color:#fff;box-shadow:none}.b.w{width:100%;margin:5px 0}.b.sm{min-height:36px;padding:5px 11px;font-size:13px}
.b:disabled,.b[disabled]{opacity:.4;pointer-events:none}
.row2{display:flex;gap:6px;align-items:center}.row2 input{flex:1;min-width:0}
.logo{font-size:34px;font-weight:900;color:var(--ac);text-align:center;margin:10px 0 0}
.sub{text-align:center;margin:0 0 6px}
/* header */
.hd{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:6px;padding:calc(6px + env(safe-area-inset-top)) 4px 6px;background:var(--bg)}
.chs{display:flex;gap:4px;flex-wrap:wrap}.ch{background:var(--card);border:1px solid var(--ln);padding:2px 9px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
.ch.tmr{background:#7a2b2b;border-color:#b55;color:#fff}.ch.gt{color:var(--ac)}
.ib{display:flex;gap:4px}.ib button{width:36px;height:36px;border-radius:50%;border:1px solid var(--ln);background:var(--card);font-size:16px;padding:0}
/* players */
.strip{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:5px;padding:2px 0 6px}
.pp{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto;column-gap:5px;align-items:center;padding:4px 7px;border-radius:12px;background:var(--card);border:1.5px solid var(--ln);cursor:pointer;min-width:0}
.pp .av{grid-row:1/3;width:21px;height:27px}.pp .av svg{width:100%;height:100%;display:block}
.pp .nm{font-size:12px;font-weight:800;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;line-height:1.3}
.pp .cs{font-size:12px;font-weight:800;color:var(--ac);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pp{overflow:hidden}.pp .cs span{display:none}.pp .cs{font-size:11.5px;letter-spacing:-.2px}.pp .nm .rkc{font-size:.85em}
.pp.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,var(--card))}.pp.out{opacity:.38;filter:grayscale(1)}.pp.me .nm::after{content:" ★";color:var(--ac)}
/* board */
.stage{position:relative;overflow:hidden;border-radius:16px;perspective:1200px;touch-action:pan-y}.stage.zm{touch-action:none}.zb{position:absolute;left:6px;bottom:6px;z-index:8;display:flex;flex-direction:column;gap:5px}.zb button{width:38px;height:38px;border-radius:12px;border:1px solid var(--ln);background:var(--card);font-size:19px;font-weight:900;padding:0;box-shadow:0 3px 10px #0006}
.tilt{position:absolute;inset:0;transform-style:preserve-3d;transform-origin:50% 100%}.t3 .tilt{transform:rotateX(22deg)}
.bd{position:absolute;left:0;top:0;width:var(--bs);height:calc(var(--bs)*1.16);display:grid;grid-template-columns:1.5fr repeat(9,minmax(0,1fr)) 1.5fr;grid-template-rows:1.5fr repeat(9,minmax(0,1fr)) 1.5fr;gap:2px;padding:3px;background:var(--frame);border-radius:14px;transform-origin:0 0;--tiltn:0deg;will-change:transform}
.t3 .bd{--tiltn:22deg}
.c{position:relative;display:flex;flex-direction:column;align-items:stretch;text-align:center;overflow:hidden;background:var(--tile);color:var(--tfg);border-radius:4px;font-size:calc(var(--bs)*var(--cf,.0205)*var(--k));line-height:1.08;font-weight:800;cursor:pointer;min-width:0;min-height:0}
.c .bar{flex:none;height:13%;min-height:4px}
.c .n{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:0 1px;text-wrap:balance}
.c .pr{flex:none;font-size:.92em;color:var(--tmut);font-weight:900;padding-bottom:1px}
.c .pr.rn{color:#1f7a45}.c.sp{background:var(--sp)}.c .ic{flex:none;font-size:1.75em;line-height:1.15;padding-top:6%}
.c.cr .ic{font-size:2.6em}.c.cr .n{font-size:1.12em}
.c .n{line-height:1.05;word-break:keep-all;overflow-wrap:normal}
.c .sic{position:absolute;top:13%;left:50%;transform:translateX(-50%);font-size:1.05em;line-height:1;opacity:.95;pointer-events:none}.c:has(.sic) .n{padding-top:1.05em}
.c.sdc .ic{font-size:1.3em;padding-top:2%}.c.sdc:has(.sic) .n{padding-top:.85em}.c.sdc .sic{font-size:.9em}
.c .ic .lake{width:1em;height:1em}
.c.f1{background:#f6dcda}.c.k1{background:#f4e6bf}
.c.ow{background:color-mix(in srgb,var(--oc) 24%,var(--tile));box-shadow:inset 0 0 0 2px var(--oc)}
.lake{width:1.25em;height:1.25em;vertical-align:middle;display:inline-block}.c .ic .lake{width:1.05em;height:1.05em}.c .bk,.c .ks{position:absolute;right:1px;top:15%;font-size:1.1em;z-index:3;line-height:1}.c .ks{left:1px;right:auto;border-radius:50%;background:#fff;box-shadow:0 0 0 2px var(--kc)}.c.mgd{filter:grayscale(.85);opacity:.6}
.c.mag::after{content:"🧲";position:absolute;bottom:1px;left:1px;font-size:.85em;opacity:.8}
.c .own{position:absolute;top:1px;left:1px;width:32%;aspect-ratio:1;border-radius:50%;background:var(--oc);border:1px solid #0007;display:grid;place-items:center;box-shadow:0 1px 2px #0007;z-index:2}.c .own svg{width:78%;height:78%}
.c .lv{position:absolute;top:0;left:0;right:0;height:13%;min-height:4px;display:flex;justify-content:center;align-items:center;gap:0}.c .lv svg{height:100%;width:auto}
.c.fl{animation:ownp 1s ease-out;z-index:5}@keyframes ownp{30%{transform:scale(1.3)}}
.c.hl{outline:3px solid var(--hc);outline-offset:-2px;z-index:4}
.mid{grid-area:2/2/11/11;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center;border-radius:10px;background:radial-gradient(circle at 50% 38%,var(--card2),var(--card) 75%);color:var(--fg);padding:6px;overflow:hidden;min-height:0}
.mid .lg1{font-size:calc(var(--bs)*.05);font-weight:900;color:var(--ac);line-height:1.2}
.mid .tr{font-size:calc(var(--bs)*.03);font-weight:800}
.mid .cz{font-size:calc(var(--bs)*.026);color:#e9a46e;font-weight:700;max-width:92%}
.mid .lgs{font-size:calc(var(--bs)*.025*var(--k));color:var(--mut);line-height:1.55;max-width:94%}
.mid .who{font-size:calc(var(--bs)*.03);font-weight:800}
.dice{display:flex;gap:calc(var(--bs)*.03);justify-content:center;align-items:center;margin:2px 0}
.sd{width:calc(var(--bs)*.11);height:calc(var(--bs)*.11);border-radius:calc(var(--bs)*.022);background:linear-gradient(145deg,#fffdf6,#e6dcc6);box-shadow:0 3px 0 #b6a98a;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:calc(var(--bs)*.016)}
.sd i,.dd i{width:62%;aspect-ratio:1;border-radius:50%;background:#1d2340;place-self:center}
.tot{font-weight:900;color:var(--ac);font-size:calc(var(--bs)*.03)}
#pwl{position:absolute;inset:0;pointer-events:none;transform-style:preserve-3d;z-index:6}
.pawn{position:absolute;transform:translate(-50%,-100%) rotateX(calc(-1*var(--tiltn)));transform-origin:50% 100%;transition:left .17s linear,top .17s linear;filter:drop-shadow(0 2px 2px #0009)}
.pawn svg{width:100%;height:100%;display:block;overflow:visible}.pawn.cur{animation:hop 1.3s ease-in-out infinite}@keyframes hop{50%{margin-top:-4px}}
/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:640px;margin:0 auto;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--ln);border-radius:20px 20px 0 0;box-shadow:0 -8px 26px #0006}
.dock .main{text-align:center;max-height:38vh;overflow:auto}.tn{font-weight:900;color:var(--ac);font-size:15px;margin:2px 0 6px}
.qr{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.fb{display:flex;flex-direction:column;align-items:center;padding:6px 2px;border-radius:12px;border:1px solid var(--ln);background:var(--card2);font-size:11.5px;font-weight:700}.fb i{font-style:normal;font-size:19px;line-height:1.3}.fb:disabled{opacity:.33}
.roll{width:100%;font-size:19px;min-height:56px;border-radius:14px}
.btns{display:flex;flex-wrap:wrap;justify-content:center;gap:2px}
.busy .dock .main button,.anim .dock .main button{pointer-events:none;opacity:.55}
/* sheets */
.mdl{position:fixed;inset:0;z-index:40;background:#000a;display:flex;align-items:flex-end;justify-content:center;animation:fi .15s}@keyframes fi{from{opacity:0}}
.mb{width:100%;max-width:640px;max-height:88vh;overflow:auto;background:var(--card);border-top:2px solid var(--ac);border-radius:20px 20px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom));text-align:center}
.mb p{margin:5px 0}.mb .lft{text-align:right}
.rtab{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0}.rtab td{padding:4px 6px;border-bottom:1px solid var(--ln)}.rtab td:last-child{text-align:left;font-weight:800}.rtab tr.on td{color:var(--ac)}
.gbar{height:10px;border-radius:5px;margin:0 0 8px}
.lgl{text-align:right;font-size:13px}.lgl p{border-bottom:1px solid var(--ln);padding:3px 0;margin:0}
.rt{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:8px;justify-content:center}.rl{text-align:right}.rl p{margin:6px 0;font-size:14px}
.bgd{border:1px solid var(--ln);border-radius:12px;padding:8px;margin:6px 0}.bgd .bt{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:2px 0}
.tray{position:fixed;inset:0;z-index:40;background:#000a;display:flex;align-items:flex-end}.trayin{width:100%;max-width:640px;margin:0 auto;background:var(--card);border-radius:20px 20px 0 0;padding:14px 12px calc(14px + env(safe-area-inset-bottom));max-height:78vh;overflow:auto;border-top:2px solid var(--ac);text-align:center}
.cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:8px 0}
.pc{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;padding:10px 8px;border-radius:14px;border:1.5px solid var(--ac2);background:var(--card2);color:var(--fg)}
.pc .ic{font-size:28px;line-height:1.2}.pc b{font-size:13.5px;line-height:1.25}.pc small{font-size:11.5px;color:var(--mut);line-height:1.35}
.pc[disabled]{opacity:.45;pointer-events:none}.pc.pn{border-color:var(--bad)}.pc.used{border-color:#6aa9e0}.pc.used small{color:var(--fg);font-size:15px;font-weight:700}.pc.big{width:min(280px,80vw);padding:20px 14px;background:var(--card)}.pc.big .ic{font-size:52px}.pc.big b{font-size:18px}.pc.big small{font-size:14px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0}
.tcd{position:relative;text-align:right;border:1px solid var(--ln);background:var(--card2);border-radius:12px;padding:10px 8px 6px;display:flex;flex-direction:column;gap:1px;overflow:hidden}.tcd i{position:absolute;top:0;left:0;right:0;height:5px}.tcd b{font-size:13px}.tcd small{color:var(--mut);font-size:11px}.tcd.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 18%,var(--card2))}.tcd em{position:absolute;top:8px;left:8px;color:var(--ac);font-style:normal;font-weight:900}.tcd[disabled]{opacity:.45}
.tcl{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:4px 0}.tcm{position:relative;background:var(--card2);border:1px solid var(--ln);border-radius:10px;padding:7px 10px 4px;font-size:13px;font-weight:700;overflow:hidden}.tcm i{position:absolute;top:0;left:0;right:0;height:4px}
.stp{display:flex;align-items:center;justify-content:center;gap:4px;margin:4px 0;flex-wrap:wrap}
.tpill{position:fixed;left:50%;transform:translateX(-50%);top:calc(60px + env(safe-area-inset-top));z-index:36;background:var(--ac);color:var(--acf);font-weight:900;padding:8px 16px;border-radius:999px;box-shadow:0 6px 18px #000a;white-space:nowrap}
/* lobby */
.pl{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--ln);gap:6px}.pl:last-child{border:0}
.ipk{display:flex;align-items:center;gap:8px;min-width:0}.ipk b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lkb{background:var(--card2);border:1.5px solid var(--ac2);border-radius:12px;padding:4px 7px;display:flex;align-items:center;gap:4px;font-size:12px}.lkb svg,.lks svg{width:24px;height:30px;display:block}
.lk{background:var(--bg2);border:1px solid var(--ln);border-radius:14px;padding:10px;margin:4px 0 10px}
.sgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:6px 0}.sgrid button{background:var(--card2);border:1.5px solid var(--ln);border-radius:10px;padding:5px 0}.sgrid button.on{border-color:var(--ac);box-shadow:0 0 0 2px color-mix(in srgb,var(--ac) 40%,transparent)}.sgrid svg{width:26px;height:32px;display:block;margin:0 auto}
.cgr{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:6px 0}.cgr button{aspect-ratio:1;border-radius:50%;border:2px solid #ffffff59;box-shadow:inset 0 0 0 1.5px #0007}.cgr button.on{outline:3px solid var(--ac);outline-offset:2px}.cgr button:disabled{opacity:.18}
.sec{font-weight:800;color:var(--ac);margin:12px 0 2px;font-size:14px}.chips{display:flex;flex-wrap:wrap;gap:4px}.chip{min-height:36px;padding:5px 12px;font-size:13px;margin:0}
.setl{margin:8px 0 2px;font-size:13px;color:var(--mut)}
/* effects */
#fx{position:fixed;inset:0;pointer-events:none;z-index:45}
.fn{position:fixed;width:150px;text-align:center;font-weight:900;font-size:18px;animation:fnu 1.4s ease-out forwards;text-shadow:0 1px 3px #000c}.fn.p{color:#7be0a6}.fn.n{color:#ff8a8d}.fn small{display:block;font-size:11px;font-weight:700;color:#fff;background:#000b;border-radius:8px;padding:1px 6px;margin-top:2px}
@keyframes fnu{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-40px)}}
#ban{position:fixed;top:calc(64px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-14px);opacity:0;z-index:50;display:flex;gap:10px;align-items:center;max-width:92vw;width:max-content;padding:10px 16px;border-radius:14px;background:var(--card);color:var(--fg);border:1.5px solid var(--ac2);box-shadow:0 10px 30px #0008;font-weight:800;font-size:14.5px;transition:.22s;pointer-events:none}
#ban.show{opacity:1;transform:translate(-50%,0)}#ban.bad{border-color:var(--bad)}#ban.good{border-color:var(--ok)}#ban .bi{font-size:28px}
.flipw{position:fixed;inset:0;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;background:#000b;pointer-events:auto;z-index:55}.fwho{color:#fff;font-weight:900;margin:0}.flipc{animation:flp .45s ease-out}@keyframes flp{from{transform:rotateY(80deg) scale(.7);opacity:0}}
.dovl{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:#0007;pointer-events:none;z-index:50}.dc{display:flex;gap:24px}
.dd{width:74px;height:74px;border-radius:16px;background:linear-gradient(145deg,#fffdf6,#e6dcc6);box-shadow:0 8px 0 #b6a98a,0 18px 26px #000a;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:12px}
.dd.roll{animation:dtum .85s cubic-bezier(.3,.7,.4,1) both}.dd.roll2{animation:dtum .85s cubic-bezier(.3,.7,.4,1) .06s both reverse}
@keyframes dtum{0%{transform:translateY(-200px) rotate(0) scale(.6);opacity:0}25%{opacity:1}55%{transform:translateY(0) rotate(420deg)}75%{transform:translateY(-26px) rotate(560deg)}100%{transform:translateY(0) rotate(720deg)}}
.dtot{font-size:26px;font-weight:900;color:#fff;background:#0f1630dd;padding:4px 20px;border-radius:14px;min-height:44px}
#toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#222d;color:#fff;padding:9px 16px;border-radius:12px;font-size:14px;display:none;z-index:70;max-width:90vw;text-align:center}
.endc .pl{font-size:15px}
/* ===================== التصميم الجديد: «ليل القاهرة» — غامق هادي وفخم ===================== */
:root[data-skin=neo]{--bg:#12151c;--bg2:#171b24;--card:#1a1f29;--card2:#212734;--ln:rgba(255,255,255,.07);--fg:#ebe6db;--mut:#8f97a8;--ac:#cfa95e;--ac2:#a8843f;--acf:#1a1408;--ok:#5fb89a;--bad:#d9706f;--tile:#1f2430;--tfg:#e7e2d7;--tmut:#b99a5a;--sp:#1b202b;--frame:#0d1016;--brass:linear-gradient(180deg,#d9b56c,#b58d45);--hair:rgba(255,255,255,.07);color-scheme:dark}
[data-skin=neo] body{font-family:'Readex Pro',Cairo,Tahoma,sans-serif;background:radial-gradient(90% 55% at 50% -12%,#1e2431 0%,rgba(30,36,49,0) 70%),#12151c;color:var(--fg);letter-spacing:.1px}
[data-skin=neo] .logo,[data-skin=neo] .lg1,[data-skin=neo] h1,[data-skin=neo] h2,[data-skin=neo] h3{font-family:'El Messiri','Readex Pro',sans-serif;font-weight:700}
[data-skin=neo] h2,[data-skin=neo] h3{color:#e3cfa0;font-size:18px}
[data-skin=neo] .tn{color:var(--fg);font-weight:600;font-size:15.5px}
[data-skin=neo] .mut{color:var(--mut)}
[data-skin=neo] .sec{color:#c8ab70;font-weight:600;font-size:13px;letter-spacing:.4px;text-transform:none;border-bottom:1px solid var(--hair);padding-bottom:4px;margin-top:16px}
[data-skin=neo] .setl{color:#9aa1b0}
/* الصفحة الرئيسية */
[data-skin=neo] #app.home{padding-top:calc(22px + env(safe-area-inset-top))}
[data-skin=neo] .logo{font-size:40px;color:#e2c487;margin:26px 0 0;display:flex;align-items:center;justify-content:center;gap:14px}
[data-skin=neo] .logo::before,[data-skin=neo] .logo::after{content:"";flex:0 0 38px;height:1px;background:linear-gradient(90deg,transparent,#cfa95e)}

.enc{position:relative;overflow:hidden}.enc>*:not(.encbg){position:relative;z-index:1}.enc .eic:has(.mwrap){animation:none}.mwrap.rev{animation:mrev 2.6s ease-out both}@keyframes mrev{0%{opacity:0;transform:translateY(26px) scale(.86);filter:brightness(0) blur(6px)}25%{opacity:0;transform:translateY(26px) scale(.86);filter:brightness(0) blur(6px)}55%{opacity:1;transform:translateY(6px) scale(.95);filter:brightness(0) blur(1px)}70%{filter:brightness(.25)}80%{transform:translateX(-3px) scale(1.02)}84%{transform:translateX(3px) scale(1.02)}88%{transform:translateX(-2px)}100%{opacity:1;transform:none;filter:none}}.enc .eic .mimg{display:block;margin:0 auto;max-width:190px;max-height:170px;width:auto;height:auto;transform-origin:50% 95%;animation:mbr 3.2s ease-in-out infinite;filter:drop-shadow(0 0 12px rgba(255,80,110,.35))}.enc .eic .mimg.mboss{max-width:220px;max-height:190px;filter:drop-shadow(0 0 18px rgba(255,30,60,.7)) saturate(1.3) hue-rotate(-10deg) contrast(1.1)}.encbg{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}.ebeam{animation:ebm 5s ease-in-out infinite}@keyframes ebm{50%{opacity:.55}}.enc .eic .msvg{filter:drop-shadow(0 0 10px rgba(255,90,120,.35))}

.enc .eic{font-size:64px;line-height:1.1;animation:emerge .8s ease-out;filter:drop-shadow(0 6px 18px rgba(209,74,92,.45))}.enc .eic .msvg{width:150px;height:134px;display:block;margin:0 auto;overflow:visible}.msvg .mbody{transform-origin:50% 95%;animation:mbr 3.2s ease-in-out infinite}@keyframes mbr{50%{transform:scale(1.03,.98)}}.msvg .meye{animation:mbl 4.5s infinite}.msvg .meye:nth-child(odd){animation-delay:1.3s}@keyframes mbl{0%,92%,100%{opacity:1}95%{opacity:.1}}.bst::after{content:'☠️';position:absolute;top:1px;right:1px;font-size:1.05em;z-index:3;filter:drop-shadow(0 0 4px #f00);animation:bsp 1.6s ease-in-out infinite}@keyframes bsp{50%{transform:scale(1.25)}}.c.bst{box-shadow:inset 0 0 0 2px #ff1f3a,0 0 10px #ff1f3a88!important}.bhp{height:8px;border-radius:5px;background:#300;margin:8px 18px 4px;overflow:hidden}.bhp i{display:block;height:100%;background:linear-gradient(90deg,#ff1f3a,#ff7a3a);transition:width .6s}.enc.bss{border-color:#ff1f3a;box-shadow:0 0 30px #ff1f3a44 inset}.pkb{display:block;margin:0 auto 8px;font-size:12.5px}

 for(const t of Object.keys(s.own))if(prev.own[t]!==s.own[t]){FLASH=+t;setTimeout(()=>{FLASH=-1},1000);sfx('buy');render()}
 s.pl.forEach((p,i)=>{const d=p.cash-((prev.pl[i]||p).cash);if(!d)return;const e=$('pp'+i);if(e){const r=e.getBoundingClientRect(),n=document.createElement('div');n.className='fn '+(d>0?'p':'n');const w=why(s,p,d);n.innerHTML=(d>0?'+':'−')+Math.abs(d)+(w?'<small>'+w+'</small>':'');n.style.left=(r.left+r.width/2-75)+'px';n.style.top=r.bottom+'px';F.appendChild(n);setTimeout(()=>n.remove(),1500)}if(i===mi){sfx(d>0?'good':'pay');if(d<0)vib(50)}});

 if(s.used&&s.used.n!==((prev.used&&prev.used.n)||0)){const u=s.used,sh=u.k[0]==='$',d=sh?(SH[u.k.slice(1)]?[SH[u.k.slice(1)].ic,SH[u.k.slice(1)].n]:null):AB[u.k],mine=!LOCAL&&mi>=0&&s.pl[mi].name===u.w;if(d&&!mine){sfx('tick');vib(40);await showCard(F,d[0],(sh?'🏪 '+u.w+' اشترى «':'🎴 '+u.w+' لعب «')+d[1]+'»',u.r,'used',null)}}

 if(S.cfg.timer){const left=S.cfg.timer-Math.floor((Date.now()-OFF-(S.now||Date.now()))/1000),e=$('tmr');if(e)e.textContent='⏱ '+Math.max(0,left);

// ================= الشبكة (MQTT) =================
// المضيف هو اللي شايل اللعبة. كل لاعب بيبعت "نبضة" كل 3 ثواني فيها آخر نسخة عنده، ولو متأخر المضيف يبعتله النسخة الجديدة.
// والمضيف بيبعت نبضة للكل، فلو حد فاته تحديث (النت قطع/الموبايل نام) بيتزامن لوحده، ولو لاعب غاب المضيف بيلعب بداله.
let conn=null,conns=[],HOST=false,mq=null,base='',cmap={},LS={},OFFL=[],LASTHB=0,HSTART=0,HOSTOFF=0,PINGI=null;
const QOS={qos:1};
const pid=()=>{try{let v=localStorage.getItem('bkpid');if(!v){v='u'+Math.random().toString(36).slice(2,10);localStorage.setItem('bkpid',v)}return v}catch(e){return 'u'+Math.random().toString(36).slice(2,10)}};
const nmv=()=>{const n=clean($('nm')&&$('nm').value)||(()=>{try{return localStorage.getItem('bknm')}catch(e){return ''}})()||'لاعب';try{localStorage.setItem('bknm',n)}catch(e){}return n};
const isOff=id=>OFFL.includes(id);
function hostMsg(cn,d){if(!d||!S)return;const id=String(d.id||'');if(id)LS[id]=Date.now();
 if(d.t==='join'){if((S.ban||[]).includes(id)){cn.send({t:'kicked'});return}cn.ok=true;const ex=S.pl.some(p=>p.id===id);
  if(S.phase==='lobby'&&!ex&&S.pl.length<10){const s=clone(S);s.pl.push(mkP(id,clean(d.name)||'لاعب'));fixLook(s);commit(s)}
  else if(!(d.en!=null&&d.en===S.en&&d.ph===S.phase))cn.send({t:'s',s:S})}
 else if(d.t==='look'&&cn.ok&&S.phase==='lobby'){const i=S.pl.findIndex(p=>p.id===id);if(i>=0&&shapesFor(S).includes(d.ic)&&COLS.includes(d.col)&&!S.pl.some((p,j)=>j!==i&&p.col===d.col)){const s=clone(S);s.pl[i].ic=d.ic;s.pl[i].col=d.col;commit(s)}}
 else if(d.t==='act'){cn.ok=true;const e0=S.en;hostApply(id,d.o);if(S.en===e0)cn.send({t:'s',s:S})}}
// الحركة اللي الموبايل بيعملها بدل لاعب ساكت أو غايب
function autoAct(){if(S.enc){const e=S.enc;hostApply(S.pl[e.pl].id,{a:e.step==='choose'?'er':'ex'});return true}const p=S.pl[S.turn];if(!p||p.out)return false;

 if(S.stage==='pick'){hostApply(p.id,{a:'pk',i:0,en:S.en});return true}
 const a=S.stage==='move'?'r':S.stage==='buy'?(S.pend&&S.pend.m!==null?'y':'k'):S.stage==='after'?'e':S.stage==='jail'?'jr':null;if(a){hostApply(p.id,{a,en:S.en});return true}return false}
function hostBeat(){if(!HOST||!S)return;const now=Date.now();
 OFFL=S.pl.filter(p=>!p.out&&p.id!==me&&now-(LS[p.id]||HSTART)>15000).map(p=>p.id);
 try{mq&&mq.connected&&mq.publish(base+'/hb',JSON.stringify({en:S.en||0,ph:S.phase,off:OFFL}))}catch(e){}
 if(S.phase!=='play')return;const idle=now-(S.now||now);if(ANIM&&idle<20000)return;
 if(S.enc){const e=S.enc;if((e.step==='res'&&idle>7000)||(isOff(S.pl[e.pl].id)&&idle>8000))autoAct();return}
 if(S.auc){const a=S.auc,i=S.pl.findIndex((p,i)=>!p.out&&i!==a.by&&!a.ps.includes(i)&&isOff(p.id));if(i>=0&&idle>3000)hostApply(S.pl[i].id,{a:'ap'});return}
 if(S.dbt.length)return;
 if(S.trade&&isOff(S.pl[S.trade.to].id)&&idle>5000){hostApply(S.pl[S.trade.to].id,{a:'tr'});return}
 for(let k=0;k<5;k++){const p=S.pl[S.turn];if(S.phase!=='play'||S.auc||S.dbt.length||!p||p.out||!isOff(p.id))break;if(!autoAct())break}}

 c.on('connect',()=>{if(!done){done=true;ok(c)}});c.on('error',()=>{});setTimeout(()=>{if(!done){done=true;try{c.end(true)}catch(e){}fail()}},8000)}

 if(!c){let won=false,fails=0;BRK.forEach((_,i)=>mconn(i,cl=>{if(won){try{cl.end(true)}catch(e){}return}won=true;hostOn(cl,i,null,st)},()=>{if(++fails===BRK.length&&!won)toast('تعذر الاتصال بأي خادم، جرّب شبكة تانية')}));return}
 const tryB=i=>{if(i>=BRK.length){toast('تعذر الاتصال بأي خادم، جرّب شبكة تانية');return}const idx=c?Number(c[0])-1:i;
  mconn(idx,cl=>hostOn(cl,idx,c,st),()=>toast('تعذر الاتصال بالخادم'))};
 tryB(0)}

   if(!HOST){HOST=true;S=st;if(!S.host)S.host=me;HSTART=Date.now();setInterval(hostBeat,3000);toast('الغرفة جاهزة ✅ الكود: '+code)}render()}}

let MYN='';
function join(c0,n0){me=pid();code=(c0||($('cd')&&$('cd').value)||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(code.length!==8||!'123'.includes(code[0])){toast('الكود غلط، لازم 8 حروف وأرقام');return}
 MYN=n0||nmv();toast('بدخل الغرفة…');base='bkhg/'+code;
 mconn(Number(code[0])-1,cl=>{mq=cl;const sub=()=>{cl.subscribe(base+'/dn/'+me,QOS);cl.subscribe(base+'/hb')};sub();
  conn={get open(){return !!mq&&mq.connected},send:x=>mq.publish(base+'/up',JSON.stringify({from:me,d:x}),QOS)};
  cl.on('message',(t,p)=>{let d;try{d=JSON.parse(p.toString())}catch(e){return}if(!d)return;
   if(t===base+'/hb'){LASTHB=Date.now();const o=JSON.stringify(OFFL),was=HOSTOFF;OFFL=d.off||[];HOSTOFF=0;if(!S||(d.en||0)!==(S.en||0)||d.ph!==S.phase)ping();if(o!==JSON.stringify(OFFL)||was)render();return}
   if(d.t==='s'){LASTHB=Date.now();if(S&&S.phase==='play'&&d.s.phase==='play'&&(d.s.en||0)<(S.en||0))return;S=d.s;if(S.now)OFF=Date.now()-S.now;
    if(S.ban&&S.ban.includes(me)&&!S.pl.some(p=>p.id===me)){toast('صاحب الغرفة طردك');S=null;try{localStorage.removeItem('bkjoin')}catch(e){};mq.end(true);render();return}
    try{if(S.phase==='end')localStorage.removeItem('bkjoin');else localStorage.setItem('bkjoin',JSON.stringify({code,name:MYN}))}catch(e){}
    if(ask&&!(S.phase==='play'&&S.pl[S.turn].id===me&&S.stage==='move'))ask=null;render()}
   else if(d.t==='kicked'){toast('صاحب الغرفة طردك من الغرفة');try{localStorage.removeItem('bkjoin')}catch(e){}}});
  cl.on('connect',()=>{sub();ping()});ping();LASTHB=Date.now();clearInterval(PINGI);PINGI=setInterval(ping,3000);
  setTimeout(()=>{if(!S)toast('لسه مفيش رد. اتأكد من الكود وإن المضيف فاتح الصفحة')},10000)},()=>toast('تعذر الاتصال بالخادم، جرّب تاني'))}
// لما الموبايل يصحى أو التاب يرجع: نعيد الاتصال ونطلب آخر نسخة
document.addEventListener('visibilitychange',()=>{if(document.hidden)return;if(mq&&!mq.connected){try{mq.reconnect()}catch(e){}}ping();if(HOST)hostBeat()});
