 if(!m){AH='<p class=tn>أنت متفرج 👀</p>';return ''}

 else if(S.stage==='buy'){const pe=S.pend,t=T[pe.t],pr=price(S),d=S.dl.reduce((a,x)=>{a[x<1?(x===0?3:0):x===1?1:2]++;return a},[0,0,0,0]);
  h='<p class=tn>وقفت على '+t.n+' (السعر '+t.p+')</p>'+(pe.m!==null?'<p>ورقة الصفقة: '+(pe.m===0?'مجانًا! 🎉':pe.m<1?'خصم ×'+pe.m:pe.m>1?'غلاء ×'+pe.m:'سعر عادي')+'</p>':'')+'<div style="text-align:center"><button class=b '+(m.cash<pr?'disabled':'')+' onclick="act(\'y\')">اشتري بـ'+pr+'</button>'+(pe.m===null?'<button class="b g" onclick="act(\'d\')">اسحب ورقة صفقة 🃏</button>':'')+'<button class="b g" onclick="act(\'k\')">سيبها</button></div><p class=mut>ورق الصفقة الباقي: خصم '+d[0]+' · عادي '+d[1]+' · غلاء '+d[2]+' · مجاني '+d[3]+'</p>'}
 else{const nb=S.chaos&&S.chaos.id==='nobk',sel=(i,d)=>PV&&PV.i===i&&PV.d===d;
  h='<p class=tn>دورك! اختار كارت:</p><div class=row>'+m.hand.map((c,i)=>{const st=(S.chaos&&S.chaos.id==='crowd'&&c===6)?3:c;return '<div class="pc mv"><div class=top2><big>'+c+(st!==c?'<small>→'+st+'</small>':'')+'</big><button class="b g bn" onclick="pv('+i+',0)">'+(sel(i,0)?'تأكيد؟':'🔥')+'</button></div><button class="b'+(sel(i,1)?' sel':'')+'" onclick="pv('+i+',1)">'+(sel(i,1)?'تأكيد ✓':'↺ قدّام')+'</button>'+(nb?'':'<button class="b bk'+(sel(i,-1)?' sel':'')+'" onclick="pv('+i+',-1)">'+(sel(i,-1)?'تأكيد ✓':'↻ ورا')+'</button>')+'</div>'}).join('')+'</div>';
  if(PV&&m.hand[PV.i]!==undefined){const c=m.hand[PV.i],st=(S.chaos&&S.chaos.id==='crowd'&&c===6)?3:c;
   if(PV.d===0)h+='<p class=hint>🔥 هتحرق الكارت وتاخد +300 ويعدّي دورك — اضغط تاني للتأكيد</p>';
   else{TG=(((p.pos+PV.d*st)%N)+N)%N;h+='<p class=hint>هتوصل: '+(T[TG].n||LB[T[TG].k])+' — اضغط تاني للتأكيد</p>'}}
  else h+='<p class=mut>↺ قدّام = اتجاه اللعب · ↻ ورا = عكسه · اضغط على خانتك عشان تطوّرها</p>'}
 let ab='<h2>كروت القدرة بتاعتك</h2>';
 if(ask&&mine){const o=opts(ask.k,m);h='<div class=askc><b>'+AB[ask.k][1]+': اختار</b><br>'+o.map(x=>'<button class=b onclick="act(\'u\','+ask.i+','+x[0]+')">'+x[1]+'</button>').join('')+'<button class="b g" onclick="ask=null;render()">إلغاء</button></div>'}
 ab+=m.ab.length?'<div class=row>'+m.ab.map((k,i)=>{const o=opts(k,m),dis=!(mine&&S.stage==='move')||(o&&!o.length);return '<div class="pc use" '+(dis?'disabled style="pointer-events:none"':'')+' onclick="'+(o?'askOpen('+i+',\''+k+'\')':'act(\'u\','+i+')')+'"><span class=ic>'+AB[k][0]+'</span><b>'+AB[k][1]+'</b><small>'+AB[k][2]+'</small></div>'}).join('')+'</div>':'<p class=mut>مفيش. اوقف على خانة السوق 🎴</p>';
 AH=h;return ab}
function panelOld(){const p=S.pl[S.turn],m=S.pl.find(x=>x.id===me),mine=p.id===me;let h='';
 if(!m)return '<div class=card>أنت متفرج 👀</div>';
 if(!mine)h='<p class=tn>الدور على '+p.name+' ⏳</p>';
 else if(S.stage==='buy'){const pe=S.pend,t=T[pe.t],pr=price(S),d=S.dl.reduce((a,x)=>{a[x<1?(x===0?3:0):x===1?1:2]++;return a},[0,0,0,0]);
  h='<p class=tn>وقفت على '+t.n+' (السعر '+t.p+')</p>'+(pe.m!==null?'<p>ورقة الصفقة: '+(pe.m===0?'مجانًا! 🎉':pe.m<1?'خصم ×'+pe.m:pe.m>1?'غلاء ×'+pe.m:'سعر عادي')+'</p>':'')+
  '<button class=b '+(m.cash<pr?'disabled':'')+' onclick="act(\'y\')">اشتري بـ'+pr+'</button>'+(pe.m===null?'<button class="b g" onclick="act(s=>{s.pend.m=dDl(s);lg(s,\'🃏 \'+s.pl[s.turn].name+\' سحب ورقة صفقة\')})">اسحب ورقة صفقة 🃏</button>':'')+'<button class="b g" onclick="act(\'k\')">سيبها</button>'+
  '<p class=mut>ورق الصفقة الباقي في الكوتشينة: خصم '+d[0]+' · عادي '+d[1]+' · غلاء '+d[2]+' · مجاني '+d[3]+'</p>'}
 else{h='<p class=tn>دورك! العب كارت حركة:</p><div class=hand>'+m.hand.map((c,i)=>'<div class=mc><big>'+c+'</big><button class=b onclick="act(\'m\','+i+',1)">▶</button>'+(S.chaos&&S.chaos.id==='nobk'?'':'<button class="b g" onclick="act(\'m\','+i+',-1)">◀</button>')+'<button class="b g" title="احرق" onclick="act(s=>{s.pl[s.turn].hand.splice('+i+',1);s.pl[s.turn].cash+=1000;lg(s,\'🔥 \'+s.pl[s.turn].name+\' حرق كارت +1000\');endTurn(s)})">🔥</button></div>').join('')+'</div><p class=mut>▶ لقدام · ◀ لورا · 🔥 احرق الكارت وخد 1000</p>'}
 let ab='<h2>كروت القدرة بتاعتك</h2>'+(m.ab.length?m.ab.map((k,i)=>{const o=opts(k,m),dis=!(mine&&S.stage==='move')||(o&&!o.length);
  return '<button class=ab '+(dis?'disabled':'')+' onclick="'+(o?'ask={i:'+i+',k:\''+k+'\'};render()':'act(\'u\','+i+')')+'">'+AB[k][0]+' <b>'+AB[k][1]+'</b><small>'+AB[k][2]+'</small></button>'}).join(''):'<p class=mut>مفيش. اوقف على خانة السوق 🎴</p>');
 if(ask&&mine){const o=opts(ask.k,m);ab='<div class=card><b>'+AB[ask.k][1]+': اختار</b><br>'+o.map(x=>'<button class=b onclick="act(\'u\','+ask.i+','+x[0]+')">'+x[1]+'</button>').join('')+'<button class="b g" onclick="ask=null;render()">إلغاء</button></div>'}
 return '<div class=card>'+h+'</div>'+ab}
function render(){const A=$('app');if(S&&S.phase==='play'&&S.en!==LASTEN){const pr=PREV;PREV=S;LASTEN=S.en;PV=null;fx(pr,S)}
 if(!S){A.innerHTML='<h1>🏦 بنك الخربطة</h1><p class=mut>لعبة لوحة أونلاين: من غير نرد، بكروت حركة وقدرات.</p><input id=nm placeholder="اسمك" maxlength=12><button class=b onclick="create()">اعمل غرفة جديدة</button><input id=cd placeholder="كود الغرفة" inputmode=numeric><button class="b g" onclick="join()">ادخل غرفة</button><hr><p class=mut>أو العبوا كلكم على موبايل واحد من غير حسابات (الكارتات بتبان للكل):</p><input id=lp placeholder="الأسماء بفاصلة: أحمد، سارة، علي"><button class="b g" onclick="localStart()">ابدأ على جهاز واحد</button>'+RES();return}
 if(S.phase==='lobby'){A.innerHTML='<h1>غرفة '+code+'</h1><p class=mut>ابعت الكود والرابط لصحابك (3 لـ10). مفيش حسابات. وانت (المضيف) لازم تفضل فاتح الصفحة.</p><div class=card>'+S.pl.map((p,i)=>'<div class=pl><span>'+pw(PC[i],16)+''+p.name+'</span></div>').join('')+'</div>'+(S.pl[0].id===me?'<button class=b '+(S.pl.length<3?'disabled':'')+' onclick="start()">ابدأ اللعبة ('+S.pl.length+')</button>'+(S.pl.length<3?'<p class=mut>محتاج 3 لاعبين على الأقل</p>':''):'<p>مستني صاحب الغرفة يبدأ…</p>');return}
 if(S.phase==='end'){const r=S.pl.map((p,i)=>[p,val(S,i)]).sort((a,b)=>b[1]-a[1]);A.innerHTML='<h1>🏆 '+r[0][0].name+' كسب!</h1><div class=card>'+r.map((x,i)=>'<div class=pl><span>'+(i+1)+'. '+x[0].name+(x[0].out?' (أفلس)':'')+'</span><b>'+x[1]+'</b></div>').join('')+'</div><button class=b onclick="location.reload()">لعبة جديدة</button>';return}
 const ABH=panel();A.innerHTML=TOP()+'<div class=bd>'+T.map((_,i)=>cell(i)).join('')+'<div class=mid>'+(S.chaos?'<div class=ch>🌪 '+S.chaos.name+'</div>':'')+'<div class=ah>'+AH+'</div><div class=lgs>'+S.log.slice(0,2).join('<br>')+'</div></div></div>'+ABH+
 '<div class=card>'+S.pl.map((p,i)=>'<div class="pl '+(p.id===me?'me':'')+'"><span>'+pw(PC[i],16)+''+p.name+(i===S.turn?' ◀':'')+(p.out?' 💥':'')+'</span><span>'+p.cash+' · ثروة '+val(S,i)+'</span></div>').join('')+'</div>'+
 '<details class=card><summary>القواعد في 6 سطور</summary><p>العب كارت حركة (1-6) وامشي لقدام أو لورا. الخانة الفاضية: اشتريها أو اسحب ورقة صفقة (التركيبة معروفة) أو سيبها. الخانة بتاعة حد: ادفع إيجار (×2 لو معاه الحي كله). كل جولة فيها خربطة جديدة. كروت القدرة بتتلعب في دورك قبل الحركة. الخانة اللي جنب كمين المرور (🧲) بتنفّذ حركتها وبعدين بتسحبك للكمين. بعد '+MAXR+' جولات الأغنى (فلوس + خانات) يكسب. اضغط على أي خانة تشوف تفاصيلها وتطوّر خاناتك.</p></details>'+MODAL()}

let peer=null,conn=null,conns=[],HOST=false;
const pid=()=>{try{let v=localStorage.getItem('bkpid');if(!v){v='u'+Math.random().toString(36).slice(2,10);localStorage.setItem('bkpid',v)}return v}catch(e){return 'u'+Math.random().toString(36).slice(2,10)}};
const nmv=()=>($('nm').value||'لاعب').trim().slice(0,12);
function ok(o){const p=S.pl[S.turn];if(!o||typeof o.a!=='string')return false;
 if(o.a==='m'||o.a==='b')return S.stage==='move'&&Number.isInteger(o.i)&&o.i>=0&&o.i<p.hand.length&&(o.a==='b'||(Math.abs(o.d)===1&&!(o.d<0&&S.chaos&&S.chaos.id==='nobk')));
 if(o.a==='y'||o.a==='d'||o.a==='k')return S.stage==='buy'&&(o.a!=='y'||p.cash>=price(S))&&(o.a!=='d'||S.pend.m===null);
 if(o.a==='u'){if(S.stage!=='move'||!Number.isInteger(o.i)||!p.ab[o.i])return false;const op=opts(p.ab[o.i],p);return !op||(op.length>0&&op.some(x=>x[0]===o.d))}
 if(o.a==='g'){const t=o.i;return S.stage==='move'&&!S.upg&&Number.isInteger(t)&&S.own[t]===S.turn&&((S.lv||{})[t]||0)<3&&p.cash>=ucost(t)}
 return false}
function apply(s,o){const t=o.a;if(t==='m')move(s,o.i,o.d);else if(t==='b')burn(s,o.i);else if(t==='y')buy(s);else if(t==='d')dealDraw(s);else if(t==='k')endTurn(s);else if(t==='u')useAb(s,o.i,o.d);else if(t==='g')build(s,o.i)}
function hostApply(id,o){if(!S||S.phase!=='play'||S.pl[S.turn].id!==id||!ok(o))return;const s=clone(S);s.evs=[];s.mv2=null;s.en=(s.en||0)+1;apply(s,o);commit(s)}
function act(a,i,d){const o={a,i,d};if(LOCAL||HOST)hostApply(me,o);else if(conn&&conn.open)conn.send({t:'act',id:me,o});else toast('مفيش اتصال')}
async function commit(s){S=s;ask=null;if(LOCAL){me=S.pl[S.turn]?S.pl[S.turn].id:me;render();return}if(HOST){try{if(s.phase==='play')localStorage.setItem('bksave',JSON.stringify({code,S:s}));else localStorage.removeItem('bksave')}catch(e){}}render();conns.forEach(c=>{try{c.open&&c.send({t:'s',s})}catch(e){}})}
function hostMsg(cn,d){if(!d)return;if(d.t==='join'){const ex=S.pl.some(p=>p.id===d.id);if(S.phase==='lobby'&&!ex&&S.pl.length<10){const s=clone(S);s.pl.push(mkP(String(d.id),String(d.name).replace(/[<>&"'`]/g,'').slice(0,12)));commit(s)}else cn.send({t:'s',s:S})}else if(d.t==='act')hostApply(String(d.id),d.o)}
function create(){me=pid();code=String(Math.floor(1000+Math.random()*9000));toast('بجهّز الغرفة…');startHost(code,{phase:'lobby',pl:[mkP(me,nmv())]})}
const PCFG={config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:global.stun.twilio.com:3478'},{urls:['turn:openrelay.metered.ca:80','turn:openrelay.metered.ca:443','turn:openrelay.metered.ca:443?transport=tcp'],username:'openrelayproject',credential:'openrelayproject'}]}};
function startHost(c,st){code=c;peer=new Peer('bkh-'+c,PCFG);
 peer.on('open',()=>{if(!HOST){HOST=true;S=st;toast('الغرفة جاهزة ✅ كود: '+c)}render()});
 peer.on('disconnected',()=>{toast('الاتصال بالخادم انقطع، برجّعه…');try{peer.reconnect()}catch(e){}});setInterval(()=>{try{if(peer&&peer.disconnected)peer.reconnect()}catch(e){}},4000);
 peer.on('error',e=>toast(e.type==='unavailable-id'?'جرّب تاني':'مشكلة اتصال: '+e.type));
 peer.on('connection',cn=>{cn.on('open',()=>conns.push(cn));cn.on('data',d=>hostMsg(cn,d));cn.on('close',()=>{conns=conns.filter(x=>x!==cn)})})}
const RES=()=>{try{const v=JSON.parse(localStorage.getItem('bksave')||'null');if(v&&v.S&&v.S.phase==='play')return '<hr><button class=b onclick="resume()">▶ كمّل اللعبة المحفوظة (غرفة '+v.code+')</button>'}catch(e){}return ''};
function resume(){try{const v=JSON.parse(localStorage.getItem('bksave'));me=pid();toast('برجّع الغرفة…');startHost(v.code,v.S)}catch(e){toast('تعذر الاستعادة')}}
function join(){me=pid();code=$('cd').value.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/\D/g,'');if(!code){toast('اكتب كود الغرفة');return}const n=nmv();let tries=0;toast('بدخل الغرفة…');peer=new Peer(undefined,PCFG);
 const go=()=>{conn=peer.connect('bkh-'+code,{reliable:true});conn.on('open',()=>conn.send({t:'join',id:me,name:n}));conn.on('data',d=>{if(d&&d.t==='s'){S=d.s;ask=null;render()}});conn.on('close',()=>toast('انقطع الاتصال بالمضيف'))};
 peer.on('open',()=>{go();setTimeout(()=>{if(!S)toast('لسه مفيش رد من المضيف. تأكد إن صفحته مفتوحة والكود صح')},12000)});
 peer.on('error',e=>{if(e.type==='peer-unavailable'&&!S&&tries<3){tries++;toast('بحاول أدخل تاني ('+tries+'/3)…');setTimeout(go,2000)}else toast(e.type==='peer-unavailable'?'مفيش غرفة بالكود ده. تأكد إن المضيف فاتح الصفحة والكود صح':'مشكلة اتصال: '+e.type)})}
render();
